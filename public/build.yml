name: "FAP: Build for multiple SDK sources"

on:
  push:
    branches:
      - main
      - master
  pull_request:
  schedule:
    - cron: "0 1 * * *"
  workflow_dispatch:

jobs:
  ufbt-build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: dev channel
            sdk-channel: dev
          - name: release channel
            sdk-channel: release
    name: 'ufbt: Build for ${{ matrix.name }}'
    steps:
      # Pinned to SHA for supply-chain security (tag: v4.2.2)
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      # Pinned to SHA for supply-chain security (tag: v0.1.3)
      - name: Build with ufbt
        uses: flipperdevices/flipperzero-ufbt-action@ac923ebbd9c8fa1ad19c23572c89136e7151a55f
        id: build-app
        with:
          sdk-channel: ${{ matrix.sdk-channel }}

      # Pinned to SHA for supply-chain security (tag: v4.6.2)
      - name: Upload app artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: bitlocker_key_manager-${{ steps.build-app.outputs.suffix }}
          path: ${{ steps.build-app.outputs.fap-artifacts }}
          if-no-files-found: error
          retention-days: 30

  ufbt-lint:
    runs-on: ubuntu-latest
    name: 'ufbt: Lint sources'
    steps:
      # Pinned to SHA for supply-chain security (tag: v4.2.2)
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      # Pinned to SHA for supply-chain security (tag: v0.1.3)
      - name: Setup ufbt
        uses: flipperdevices/flipperzero-ufbt-action@ac923ebbd9c8fa1ad19c23572c89136e7151a55f
        id: setup-ufbt
        with:
          task: setup
          sdk-channel: dev

      # Pinned to SHA for supply-chain security (tag: v0.1.3)
      - name: Lint sources
        uses: flipperdevices/flipperzero-ufbt-action@ac923ebbd9c8fa1ad19c23572c89136e7151a55f
        with:
          skip-setup: true
          task: lint

  release:
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    needs: [ufbt-build, ufbt-lint]
    runs-on: ubuntu-latest
    name: 'Create Release'
    permissions:
      contents: write
    steps:
      # Pinned to SHA for supply-chain security (tag: v4.2.2)
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0

      # Pinned to SHA for supply-chain security (tag: v4.3.0)
      - name: Download all artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          path: artifacts/

      # Pinned to SHA for supply-chain security (tag: v2.3.2)
      - name: Create Release
        uses: softprops/action-gh-release@72f2c25fcb47643c292f7107632f7a47c1df5cd8
        with:
          tag_name: v${{ github.run_number }}
          name: "Build #${{ github.run_number }}"
          body: |
            ## BitLocker Key Manager — Build #${{ github.run_number }}

            ### Build Info
            | Field | Value |
            |-------|-------|
            | **Commit** | `${{ github.sha }}` |
            | **Branch** | `${{ github.ref_name }}` |
            | **Triggered by** | `${{ github.actor }}` |
            | **Date** | ${{ github.event.head_commit.timestamp }} |

            ### Installation
            1. Download the `.fap` file matching your firmware version
            2. Copy to Flipper Zero SD card: `/ext/apps/Tools/`
            3. Launch from **Apps → Tools → BitLocker Key Mgr**

            ### Files
            - `*-dev.fap` — Built for dev/unleashed firmware
            - `*-release.fap` — Built for official release firmware
          files: artifacts/**/*.fap
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
